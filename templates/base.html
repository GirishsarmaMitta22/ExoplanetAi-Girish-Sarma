<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Exoplanet AI{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
        }

        h1,
        h2,
        h3,
        h4,
        .navbar-brand {
            font-family: 'Orbitron', sans-serif;
            color: #66fcf1;
        }

        .navbar {
            background-color: #1f2833;
            border-bottom: 2px solid #45a29e;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }

        .nav-link {
            color: #c5c6c7 !important;
        }

        .nav-link:hover {
            color: #66fcf1 !important;
        }

        .footer {
            background-color: #1f2833;
            color: #66fcf1;
            padding: 20px 0;
            margin-top: 40px;
            border-top: 2px solid #45a29e;
        }

        .btn-primary {
            background-color: #45a29e;
            border-color: #45a29e;
            color: #0b0c10;
            font-weight: bold;
        }

        .btn-primary:hover {
            background-color: #66fcf1;
            border-color: #66fcf1;
            color: #0b0c10;
        }

        .card {
            background-color: #1f2833;
            border: 1px solid #45a29e;
            color: #c5c6c7;
        }

        .form-control {
            background-color: #0b0c10;
            border: 1px solid #45a29e;
            color: #c5c6c7;
        }

        .form-control:focus {
            background-color: #0b0c10;
            color: #ffffff;
            border-color: #66fcf1;
            box-shadow: 0 0 5px #66fcf1;
        }
    </style>
    {% block head %}{% endblock %}
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Exoplanet AI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Predict</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer text-center">
        <div class="container">
            <p>&copy; 2026 Exoplanet AI - Exploring the Cosmos</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
